name: Build EMFRadarSensor with Rush 2

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Java source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/com/emfradar/sensor
          cp EMFRadarSensor_source/src/com/emfradar/sensor/EMFRadarSensor.java src/com/emfradar/sensor/
          test -s src/com/emfradar/sensor/EMFRadarSensor.java
          echo "EMF sensor source prepared"

      - name: Install Rush
        uses: shreyashsaitwal/rush-cli@v2
        with:
          version: 2.1.2

      - name: Resolve dependencies
        run: rush deps sync

      - name: Build EMF extension
        run: rush build

      - name: Upload AIX artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EMFRadarSensor-Rush2-build
          path: out/
          if-no-files-found: warn
